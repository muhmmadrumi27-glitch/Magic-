version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keyaz
      POSTGRES_PASSWORD: keyazpassword
      POSTGRES_DB: keyaz_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keyaz_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "","--appendonly", "no"]
    networks:
      - keyaz_net

  chromadb:
    image: chromadb/chromadb:latest
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    ports:
      - "8001:8000"
    networks:
      - keyaz_net

  browserless:
    image: browserless/chrome:latest
    environment:
      CONNECTION_TIMEOUT: 60000
      MAX_CONCURRENT_SESSIONS: 10
    ports:
      - "3001:3000"
    networks:
      - keyaz_net

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - POSTGRES_USER=keyaz
      - POSTGRES_PASSWORD=keyazpassword
      - POSTGRES_DB=keyaz_db
      - POSTGRES_SERVER=postgres
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_URL=http://chromadb:8000
      - BROWSERLESS_WS=ws://browserless:3000?--timeout=60000
      - SECRET_KEY=${SECRET_KEY}
      - FERNET_KEY=${FERNET_KEY}
    depends_on:
      - postgres
      - redis
      - chromadb
      - browserless
    ports:
      - "8000:8000"
    networks:
      - keyaz_net

  celery_worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      - redis
      - postgres
      - chromadb
      - browserless
    networks:
      - keyaz_net

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    networks:
      - keyaz_net

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - keyaz_net

volumes:
  postgres_data:

networks:
  keyaz_net:
    driver: bridge
